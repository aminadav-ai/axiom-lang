[package]
name = "axiom-lang"
version = "0.1.0"
edition = "2021"
description = "Axiom: Content-addressed, Z3-verified AI-native programming language"
license = "BUSL-1.1"
publish = false

[lib]
name = "axiom_lang"
path = "src/lib.rs"

[[bin]]
name = "axiom"
path = "src/main.rs"

[dependencies]
blake3 = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
